[workspace]
resolver = "3"
default-members = ["hypervisor"]
members = [
  "hypervisor",
  "l1_hypervisor",
  "arch",
  "support/allocator",
  "support/fdt",
  "support/string_utils",
  "support/mmio",
  "guest/device_core",
  "guest/devices/virtio",
  "xtask",
]

[workspace.dependencies]
# support crates
arch = { path = "arch" }
allocator = { path = "support/allocator" }
fdt = { path = "support/fdt" }
string_utils = { path = "support/string_utils" }
